server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
  }
  location = /readyz { proxy_pass http://api:8000; }
  location = /healthz { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
