[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-growth-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1", "alembic>=1.15,<2", "pgvector>=0.3.6,<1",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "fastembed>=0.6,<1",
  "google-genai>=1.30,<2", "beautifulsoup4>=4.13,<5", "bleach>=6.2,<7",
  "tinycss2>=1.4,<2", "PyYAML>=6,<7", "markdown-it-py>=3,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a migrated test PostgreSQL database"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
